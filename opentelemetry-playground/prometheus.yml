global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: greptimedb
    static_configs:
      - targets: ["greptimedb:4000"]
  - job_name: ad
    static_configs:
      - targets: ["ad:9465"]

remote_write:
  - url: http://greptimedb:4000/v1/prometheus/write?db=public
