name: Multiple linters
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
  run:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: crate-ci/typos@master

  dashboards:
    name: Dashboard translations
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python grafana-common/localize.py --check
