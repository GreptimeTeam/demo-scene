name: Bump Patch Version

# Dispatched by the GreptimeDB release workflow (cyborg/bin/bump-versions.ts) after the images are on Docker Hub.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable GreptimeDB release without the v prefix (e.g., 1.3.2)'
        required: true
        type: string

jobs:
  bump-greptimedb-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update demos
        env:
          VERSION: ${{ inputs.version }}
        run: .github/scripts/release-patch.sh "$VERSION"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: bump greptimedb version to ${{ inputs.version }}"
          title: "chore: bump greptimedb version to ${{ inputs.version }}"
          body: "Updates the GreptimeDB image in every demo, the image digest in `opentelemetry-playground/images.lock.json`, and the version in `README.md` to v${{ inputs.version }}."
          branch: "bump-greptimedb-${{ inputs.version }}"
          base: main
          delete-branch: true
