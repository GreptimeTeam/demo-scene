include:
  - ../greptimedb-common.yml

services:
  grafana-router:
    extends:
      file: ../grafana-common/compose.yml
      service: grafana-router
    ports:
      - "3000:3000"
    environment:
      DASHBOARD_UID: todo-api-trace-v2
    networks:
      - demo-network

  init_database:
    image: docker.io/postgres:17
    networks:
      - demo-network
    depends_on:
      greptimedb:
        condition: service_healthy
    volumes:
      - ./init.sql:/init.sql
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until psql -v ON_ERROR_STOP=1 -h greptimedb -p 4003 -d public -c 'SELECT 1 FROM web_trace_demo_v2 LIMIT 1'; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then
            echo "Trace table did not appear within 120 seconds" >&2
            exit 1
          fi
          sleep 2
        done
        exec psql -v ON_ERROR_STOP=1 -h greptimedb -p 4003 -d public -f /init.sql
    environment:
      PGSSLMODE: disable
    init: true

  django:
    networks:
      - demo-network
    build: django-app/
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - ALLOWED_HOSTS=*
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://greptimedb:4000/v1/otlp/v1/traces

  client:
    networks:
      - demo-network
    build: todo-client/
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://greptimedb:4000/v1/otlp/v1/traces
      - BASE_URL=http://django:8000
    depends_on:
      - django

  grafana:
    networks:
      - demo-network
    image: docker.io/grafana/grafana:12.3.0
    volumes:
      - ./grafana_provisioning:/etc/grafana/provisioning

    environment:
      GF_USERS_DEFAULT_LANGUAGE: detect

networks:
  demo-network:
