# include:
#   - ../greptimedb-common.yml

services:
  # TODO(LFC): Restore the top-level include and remove this override once the
  # shared stable image in greptimedb-common.yml supports Trace V2.
  greptimedb:
    extends:
      file: ../greptimedb-common.yml
      service: greptimedb
    image: docker.io/greptime/greptimedb-nightly:nightly-20260922-9dfe05719

  init_database:
    image: docker.io/postgres:17
    networks:
      - demo-network
    depends_on:
      greptimedb:
        condition: service_healthy
    volumes:
      - ./init.sql:/init.sql
    entrypoint: sh -c "sleep 10 && psql -h greptimedb -p 4003 -d public -f /init.sql"
    environment:
      PGSSLMODE: disable
    init: true

  django:
    networks:
      - demo-network
    build: django-app/
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - ALLOWED_HOSTS=*
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://greptimedb:4000/v1/otlp/v1/traces

  client:
    networks:
      - demo-network
    build: todo-client/
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://greptimedb:4000/v1/otlp/v1/traces
      - BASE_URL=http://django:8000
    depends_on:
      - django

  grafana:
    networks:
      - demo-network
    image: docker.io/grafana/grafana:12.3.0
    ports:
      - 3000:3000
    volumes:
      - ./grafana_provisioning:/etc/grafana/provisioning

networks:
  demo-network:
