name: greptime-weather
services:
  greptimedb:
    image: greptime/greptimedb:v1.3.0
    command: standalone start --http-addr=0.0.0.0:4000 --grpc-bind-addr=0.0.0.0:4001 --mysql-addr=0.0.0.0:4002 --postgres-addr=0.0.0.0:4003
    ports:
      - "127.0.0.1:${GREPTIME_HTTP_PORT:-28400}:4000"
      - "127.0.0.1:${GREPTIME_PG_PORT:-28403}:4003"
    volumes:
      - greptime-data:/greptimedb_data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:4000/health]
      interval: 3s
      timeout: 3s
      retries: 30
  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/weather.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      greptimedb:
        condition: service_healthy
  gateway:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-23000}:80"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - grafana
  ingest:
    profiles: [tools]
    build: .
    environment:
      GREPTIME_URL: http://greptimedb:4000
    volumes:
      - ./data:/app/data
    depends_on:
      greptimedb:
        condition: service_healthy
volumes:
  greptime-data:
