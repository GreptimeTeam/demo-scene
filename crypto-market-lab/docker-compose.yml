name: greptime-crypto

x-ingest: &ingest
  image: greptime-crypto-ingest:local
  build: .
  init: true
  environment:
    GREPTIME_URL: http://greptimedb:4000
  volumes:
    - ./data:/app/data
  depends_on:
    init:
      condition: service_completed_successfully

services:
  greptimedb:
    image: greptime/greptimedb:v1.3.0
    command: standalone start --http-addr=0.0.0.0:4000 --postgres-addr=0.0.0.0:4003
    ports:
      - "127.0.0.1:${GREPTIME_HTTP_PORT:-25400}:4000"
      - "127.0.0.1:${GREPTIME_PG_PORT:-25403}:4003"
    volumes:
      - greptime-data:/greptimedb_data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:4000/health]
      interval: 3s
      timeout: 3s
      retries: 30
  init:
    image: greptime-crypto-ingest:local
    build: .
    command: ["init"]
    environment:
      GREPTIME_URL: http://greptimedb:4000
    depends_on:
      greptimedb:
        condition: service_healthy
  history:
    <<: *ingest
    command: ["history"]
  live:
    <<: *ingest
    command: ["live"]
    restart: unless-stopped
  quotes:
    <<: *ingest
    entrypoint: ["python", "-u", "quotes.py"]
    restart: unless-stopped
  desk:
    <<: *ingest
    environment:
      GREPTIME_URL: http://greptimedb:4000
      GRAFANA_PORT: "${GRAFANA_PORT:-25300}"
    entrypoint: ["python", "-u", "serve.py"]
    ports:
      - "127.0.0.1:${DESK_PORT:-25200}:8080"
    restart: unless-stopped
  ingest:
    <<: *ingest
    profiles: [tools]
  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_LANGUAGE: detect
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      init:
        condition: service_completed_successfully
  grafana-router:
    extends:
      file: ../grafana-common/compose.yml
      service: grafana-router
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-25300}:3000"
    environment:
      DASHBOARD_UID: crypto-market

volumes:
  greptime-data:
